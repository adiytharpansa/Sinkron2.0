name: Sinkron my-anime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_episodes:
        description: "Batas episode per run"
        required: false
        default: "20"
      dry_run:
        description: "Dry run (tidak menulis ke katalog)"
        type: boolean
        required: false
        default: false

concurrency:
  group: sinkron-my-anime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore sync cache
        uses: actions/cache@v4
        with:
          path: .sync-cache.json
          key: sync-cache-${{ github.run_id }}
          restore-keys: |
            sync-cache-
      - name: Jalankan sinkron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MAX: ${{ inputs.max_episodes || '20' }}
        run: node scripts/sync.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
