name: Sapuan Subtitle

on:
  workflow_dispatch:
    inputs:
      max_per_shard:
        description: "Batas episode diperbarui per shard"
        required: false
        default: "800"
      concurrency:
        description: "Paralel judul per shard"
        required: false
        default: "4"
      only_id:
        description: "Hanya satu judul (id katalog), kosongkan untuk semua"
        required: false
        default: ""
      dry_run:
        description: "Dry run (tidak menulis ke katalog)"
        type: boolean
        required: false
        default: false

concurrency:
  group: sapuan-subtitle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  subs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_TOTAL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Jalankan sapuan subtitle (shard ${{ matrix.shard }})
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          CONCURRENCY: ${{ inputs.concurrency || '4' }}
          SUBS_MAX: ${{ inputs.max_per_shard || '800' }}
        run: node scripts/subs.mjs ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.only_id && format('--only {0}', inputs.only_id) || '' }}
