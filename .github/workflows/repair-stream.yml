name: Repair Stream

on:
  workflow_dispatch:
    inputs:
      only_id:
        description: "Hanya satu judul (id katalog), kosongkan untuk semua target"
        required: false
        default: ""
      dry_run:
        description: "Dry run (probe saja, tidak menulis ke katalog)"
        type: boolean
        required: false
        default: false
      targets_file:
        description: "Berkas target (repair-targets.json / repair-targets2.json)"
        required: false
        default: "repair-targets.json"

concurrency:
  group: repair-stream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair
        env:
          TARGETS_FILE: ${{ inputs.targets_file }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.only_id }}" ]; then ARGS="$ARGS --only ${{ inputs.only_id }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node scripts/repair-stream.mjs $ARGS
